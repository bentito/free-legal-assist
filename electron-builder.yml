appId: com.lexharness.desktop
productName: LexHarness
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
mac:
  category: public.app-category.productivity
  extendInfo:
    NSDownloadsFolderUsageDescription: "LexHarness accesses the Downloads folder only when you explicitly choose to import case documents."
    NSDocumentsFolderUsageDescription: "LexHarness accesses the Documents folder only when you explicitly choose to import case documents."
    NSDesktopFolderUsageDescription: "LexHarness accesses the Desktop folder only when you explicitly choose to import case documents."
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
