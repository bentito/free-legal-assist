name: Feature or Practice Idea
description: Suggest a legal workflow, practice area profile, court rule, or improvement
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love hearing from practicing lawyers, paralegals, and developers! Tell us what would make LexHarness more useful in your day-to-day work.
  - type: dropdown
    id: contributor-type
    attributes:
      label: Your Background
      options:
        - Practicing Lawyer / Legal Professional
        - Software Developer
        - Both / Other
    validations:
      required: true
  - type: input
    id: practice-area
    attributes:
      label: Practice Area & Jurisdiction (Optional)
      description: If this relates to a specific area of law or court, let us know.
      placeholder: "e.g., Criminal Defense (State Court), Family Law, Immigration, Commercial Contracts"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What legal task or problem are you trying to solve?
      description: Describe the real-world workflow or frustration this would help with.
      placeholder: "e.g., When reviewing discovery packets or police reports, I spend hours cross-referencing timestamps against deposition testimony..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like LexHarness to help?
      description: Explain how it would ideally work for you.
      placeholder: "Describe what you'd like the assistant to draft, check, or organize."
    validations:
      required: true
