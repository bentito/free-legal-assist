name: Bug or Issue Report
description: Let us know if something in LexHarness isn't working the way it should
title: "[Issue]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for letting us know about an issue! Please describe what happened in plain language so we can fix it. (**Note:** Never paste confidential client information here.)
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what went wrong or didn't work as expected.
      placeholder: "e.g., When I clicked to review my draft motion, the redline view didn't update..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we see the problem?
      description: What steps were you taking when this happened?
      placeholder: |
        1. Opened my matter
        2. Asked the assistant to draft a motion
        3. Clicked the Redline tab
        4. Saw...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened instead?
      placeholder: "e.g., It should have shown the revised draft with changes highlighted."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What kind of computer are you using?
      options:
        - Mac (Apple Silicon / M1, M2, M3, M4)
        - Mac (Intel)
        - Windows
        - Other / Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Message or Details (Optional)
      description: If an error message popped up on screen, copy or describe it here.
      validations:
        required: false
