name: Bug Report
description: Report an issue or bug encountered in LexHarness
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open Matter '...'
        2. Enter prompt '...'
        3. Click 'Run Agent Loop'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: The agent loop should complete and display the redline review...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x64)
        - Windows 11 / 10
        - Linux
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version / Commit
      placeholder: "e.g., v0.3.0 or commit SHA"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console or Terminal Logs
      description: Paste any error messages, terminal logs, or DevTools console errors.
      render: shell
